    function normalizeArtFilename(raw) {
      let clean = (raw || '').trim().replace(/^\/+/, '');
      if (!clean) return 'artwork.jpg';
      if (!/\.(jpe?g|png|webp|gif)$/i.test(clean)) {
        clean += '.jpg';
      }
      return clean;
    }

    function normalizeHtmlFilename(raw) {
      let clean = (raw || '').trim().replace(/[^a-zA-Z0-9._-]/g, '');
      if (!clean) return 'card.html';
      if (!/\.html?$/i.test(clean)) {
        clean += '.html';

      return clean;

    function escapeHtml(str) {

        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

        const merger = audioCtx.createChannelMerger(2);

        feedbackL.connect(delayR);
        delayR.connect(feedbackR);
        feedbackR.connect(delayL);

        delayL.connect(merger, 0, 0);
        delayR.connect(merger, 0, 1);

        const notes = [

      document.getElementById('outCode').value = html;
      document.getElementById('statusMsg').textContent = `Siap dijana — gambar disetkan ke "${artFile}".`;
    }

    function copyCode() {
      const ta = document.getElementById('outCode');
      if (!ta.value) generateCard();
      ta.select();
      navigator.clipboard?.writeText(ta.value).catch(() => {});
      document.getElementById('statusMsg').textContent = 'Kod HTML disalin!';
    }

    function downloadHtml() {
      const ta = document.getElementById('outCode');
      if (!ta.value) generateCard();
      const fname = normalizeHtmlFilename(document.getElementById('mFile').value);
      document.getElementById('mFile').value = fname;
      const blob = new Blob([ta.value], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('statusMsg').textContent = `Fail "${fname}" dimuat turun.`;
    }

    generateCard();
  </script>
</body>
</html>

    [data-theme="royal-purple"] { --bg-grad: radial-gradient(circle at top, #3b0764, #170326); --env-body: #2e064d; --env-flap: #4c0b7d; --card-bg: #220438; --text-main: #f3e8ff; --text-accent: #f59e0b; --border-col: #f59e0b; --shadow-col: rgba(245, 158, 11, 0.28); }
    [data-theme="teal-mint"] { --bg-grad: radial-gradient(circle at top, #115e59, #042f2e); --env-body: #0f4c48; --env-flap: #166963; --card-bg: #0b3b38; --text-main: #f0fdfa; --text-accent: #5eead4; --border-col: #5eead4; --shadow-col: rgba(94, 234, 212, 0.25); }
    [data-theme="crimson-velvet"] { --bg-grad: radial-gradient(circle at top, #7f1d1d, #2b0606); --env-body: #5c1111; --env-flap: #7f1d1d; --card-bg: #420b0b; --text-main: #fef2f2; --text-accent: #fbbf24; --border-col: #fbbf24; --shadow-col: rgba(251, 191, 36, 0.28); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0b0f17;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .wrap { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

    .panel {
      background: #131b2b;
      border: 1px solid #26354f;
      border-radius: 14px;
      padding: 16px;
    }
    .panel h2 { font-size: 17px; margin-bottom: 12px; color: #facc15; }
    .grp { margin-bottom: 12px; }
    .grp label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .grp input, .grp select, .grp textarea {
      width: 100%; padding: 9px 10px; border-radius: 8px;
      border: 1px solid #334155; background: #0b111d; color: #fff; font-size: 13.5px;
    }
    .btn-dl {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #eab308; color: #0f172a; font-weight: bold; font-size: 14px; cursor: pointer;
      margin-top: 6px;
    }

    /* Live Preview Box */

      background: var(--bg-grad);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 14px;
      font-family: Georgia, serif;
      color: var(--text-main);
      text-align: center;
    }
    .mini-card {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .mini-art {
      width: 140px; height: 140px; margin: 0 auto 14px;

      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);

    .mini-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .anim-spin img { animation: spin360 14s linear infinite; }

    .anim-float { animation: floatY 3.5s ease-in-out infinite; }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .anim-flip img { animation: flipY 7s ease-in-out infinite; }
    @keyframes flipY { 0%,100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }

    .mini-p { font-size: 14px; line-height: 1.55; margin-bottom: 10px; white-space: pre-line; }
    .mini-s { font-size: 13px; font-style: italic; color: var(--text-accent); border-top: 1px dashed var(--border-col); padding-top: 10px; margin-bottom: 12px; white-space: pre-line; }
    .mini-by { font-size: 13px; }
    .mini-by strong { color: var(--text-accent); }
  </style>
</head>
<body data-theme="black-gold">

        <label>7. Second Language / Extra Wish</label>
        <textarea id="mSecondary" rows="3" oninput="syncPreview()"></textarea>
      </div>

      <div class="grp">
        <label>8. Sender Name</label>
        <input type="text" id="mSender" value="Dzul" oninput="syncPreview()" />
      </div>

    </div>

        <div class="mini-s" id="pSecondary"></div>
        <div class="mini-by">With warm wishes,<br /><strong id="pSender">Dzul</strong></div>
      </div>
    </div>

    function applyPreset() {
      const w = WISHES[document.getElementById('mPreset').value];
      document.getElementById('mPrimary').value = w.primary;
      document.getElementById('mSecondary').value = w.secondary;
      syncPreview();
    }

    function getData() {
      return {
        theme: document.getElementById('mTheme').value,
        recipient: document.getElementById('mRecipient').value,
        artwork: document.getElementById('mArtwork').value || "artwork.jpg",
        anim: document.getElementById('mAnim').value,
        primary: document.getElementById('mPrimary').value,
        secondary: document.getElementById('mSecondary').value,
        sender: document.getElementById('mSender').value
      };
    }

    function syncPreview() {
      const d = getData();
      document.getElementById('previewShell').setAttribute('data-theme', d.theme);
      document.getElementById('pName').textContent = d.recipient || "Happy Birthday!";
      document.getElementById('pArtFrame').className = "mini-art " + d.anim;
      const img = document.getElementById('pImg');
      const fb = document.getElementById('pFb');
      img.style.display = "block";
      fb.style.display = "none";
      img.src = d.artwork;
      document.getElementById('pPrimary').textContent = d.primary;
      const sec = document.getElementById('pSecondary');
      if (d.secondary.trim()) { sec.style.display = "block"; sec.textContent = d.secondary; }
      else { sec.style.display = "none"; }
      document.getElementById('pSender').textContent = d.sender;
    }

    function generateCleanRecipientHTML() {
      const d = getData();
      const safeJson = JSON.stringify(d).replace(/</g, "\\u003c");
      const cleanHTML = `<!DOCTYPE html>

    .replay-btn { margin-top: 18px; background: transparent; border: 1px solid var(--border-col); color: var(--text-accent); padding: 7px 14px; border-radius: 20px; font-size: 12px; font-family: system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body data-theme="${d.theme}">
  <div class="sparkles" id="sparkles"></div>
  <main class="stage">
    <div class="envelope-wrapper" id="envelope" onclick="openCard()">
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-pocket"></div>
      <div class="wax-seal">Tap</div>
      <div class="tap-hint">Tap envelope to open</div>
    </div>
    <section class="card" id="card">
      <div style="color:var(--text-accent);font-size:18px;letter-spacing:6px;margin-bottom:8px;">✦ ✦ ✦</div>
      <div style="font-family:system-ui,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:2.5px;color:var(--text-accent);margin-bottom:6px;">Selamat Hari Lahir • Happy Birthday</div>
      <h1 class="recipient-name">${escapeHtml(d.recipient || "Happy Birthday!")}</h1>
      <div class="artwork-frame ${d.anim}">
        <img src="${escapeHtml(d.artwork)}" alt="Birthday Artwork" onerror="this.style.display='none';document.getElementById('artFallback').style.display='flex';" />
        <div id="artFallback" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:44px;">🎂</div>
      </div>
      <p class="wish-primary">${escapeHtml(d.primary)}</p>
      ${d.secondary.trim() ? `<p class="wish-secondary">${escapeHtml(d.secondary)}</p>` : ""}
      <div class="sender-signoff">With warm wishes,<br /><strong>${escapeHtml(d.sender)}</strong></div>
      <button class="replay-btn" onclick="playBirthdayMelody()">♪ Replay 3D Echo Melody</button>
    </section>
  </main>
  <script>
    const c = document.getElementById('sparkles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (5 + Math.random() * 5) + 's';
      c.appendChild(s);
    }
    function openCard() {
      document.getElementById('envelope').classList.add('opening');
      playBirthdayMelody();
      setTimeout(() => {
        document.getElementById('envelope').classList.add('hidden-env');
        document.getElementById('card').classList.add('visible');
      }, 650);
    }
    let audioCtx = null;
    function playBirthdayMelody() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const masterGain = audioCtx.createGain(); masterGain.gain.value = 0.28;
        const delayL = audioCtx.createDelay(); delayL.delayTime.value = 0.26;
        const delayR = audioCtx.createDelay(); delayR.delayTime.value = 0.39;
        const feedbackL = audioCtx.createGain(); feedbackL.gain.value = 0.35;
        const feedbackR = audioCtx.createGain(); feedbackR.gain.value = 0.35;
        const merger = audioCtx.createChannelMerger(2);
        delayL.connect(feedbackL); feedbackL.connect(delayR); delayR.connect(feedbackR); feedbackR.connect(delayL);
        delayL.connect(merger, 0, 0); delayR.connect(merger, 0, 1);
        merger.connect(masterGain); masterGain.connect(audioCtx.destination);
        const notes = [
          [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [349.23, 0.55], [329.63, 1.00],
          [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [392.00, 0.55], [349.23, 1.00],
          [261.63, 0.35], [261.63, 0.20], [523.25, 0.55], [440.00, 0.55], [349.23, 0.55], [329.63, 0.55], [293.66, 0.90],
          [466.16, 0.35], [466.16, 0.20], [440.00, 0.55], [349.23, 0.55], [392.00, 0.55], [349.23, 1.20]
        ];
        let time = audioCtx.currentTime + 0.08;
        notes.forEach(([freq, dur], idx) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          const panner = audioCtx.createStereoPanner();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, time);
          panner.pan.setValueAtTime(Math.sin(idx * 0.7) * 0.65, time);
          noteGain.gain.setValueAtTime(0.001, time);
          noteGain.gain.exponentialRampToValueAtTime(0.65, time + 0.03);
          noteGain.gain.exponentialRampToValueAtTime(0.001, time + dur + 0.35);
          osc.connect(noteGain); noteGain.connect(panner); panner.connect(masterGain); panner.connect(delayL);
          osc.start(time); osc.stop(time + dur + 0.4);
          time += dur + 0.05;
        });
      } catch (e) {}
    }
  <\/script>
</body>
</html>`;
      const blob = new Blob([cleanHTML], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    applyPreset();
  </script>
</body>
</html>

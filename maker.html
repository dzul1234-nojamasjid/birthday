<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Birthday E-Card Maker (Private)</title>
  <style>
    :root {
      --bg-grad: radial-gradient(circle at top, #1f1c18, #090806);
      --env-body: #171511;
      --env-flap: #26221a;
      --card-bg: #12100d;
      --text-main: #f8ecd4;
      --text-accent: #d4af37;
      --border-col: #d4af37;
      --shadow-col: rgba(212, 175, 55, 0.3);
    }
    [data-theme="black-gold"] { --bg-grad: radial-gradient(circle at top, #1f1c18, #090806); --env-body: #171511; --env-flap: #26221a; --card-bg: #12100d; --text-main: #f8ecd4; --text-accent: #d4af37; --border-col: #d4af37; --shadow-col: rgba(212, 175, 55, 0.3); }
    [data-theme="emerald-gold"] { --bg-grad: radial-gradient(circle at top, #0d3b2e, #041a14); --env-body: #092e24; --env-flap: #114738; --card-bg: #07261d; --text-main: #ffffff; --text-accent: #facc15; --border-col: #facc15; --shadow-col: rgba(250, 204, 21, 0.28); }

    [data-theme="classic-ivory"] { --bg-grad: radial-gradient(circle at top, #faf6ee, #e7dec8); --env-body: #dfd3bc; --env-flap: #cfc0a3; --card-bg: #fffdf9; --text-main: #292524; --text-accent: #b45309; --border-col: #b45309; --shadow-col: rgba(180, 83, 9, 0.2); }
    [data-theme="sunset-coral"] { --bg-grad: radial-gradient(circle at top, #fb7185, #9f1239); --env-body: #be123c; --env-flap: #e11d48; --card-bg: #881337; --text-main: #ffffff; --text-accent: #fde047; --border-col: #fde047; --shadow-col: rgba(253, 224, 71, 0.25); }

    [data-theme="teal-mint"] { --bg-grad: radial-gradient(circle at top, #115e59, #042f2e); --env-body: #0f4c48; --env-flap: #166963; --card-bg: #0b3b38; --text-main: #f0fdfa; --text-accent: #5eead4; --border-col: #5eead4; --shadow-col: rgba(94, 234, 212, 0.25); }
    [data-theme="crimson-velvet"] { --bg-grad: radial-gradient(circle at top, #7f1d1d, #2b0606); --env-body: #5c1111; --env-flap: #7f1d1d; --card-bg: #420b0b; --text-main: #fef2f2; --text-accent: #fbbf24; --border-col: #fbbf24; --shadow-col: rgba(251, 191, 36, 0.28); }
    [data-theme="minimal-slate"] { --bg-grad: radial-gradient(circle at top, #334155, #0f172a); --env-body: #1e293b; --env-flap: #334155; --card-bg: #0f172a; --text-main: #f8fafc; --text-accent: #38bdf8; --border-col: #94a3b8; --shadow-col: rgba(56, 189, 248, 0.22); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0b0f17;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .wrap { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

    .panel {
      background: #131b2b;
      border: 1px solid #26354f;
      border-radius: 14px;
      padding: 16px;
    }
    .panel h2 { font-size: 17px; margin-bottom: 12px; color: #facc15; }
    .grp { margin-bottom: 12px; }
    .grp label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .grp input, .grp select, .grp textarea {
      width: 100%; padding: 9px 10px; border-radius: 8px;
      border: 1px solid #334155; background: #0b111d; color: #fff; font-size: 13.5px;
    }
    .btn-dl {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #eab308; color: #0f172a; font-weight: bold; font-size: 14px; cursor: pointer;
      margin-top: 6px;
    }

    /* Live Preview Box */
    .preview-shell {
      background: var(--bg-grad);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 14px;
      font-family: Georgia, serif;
      color: var(--text-main);
      text-align: center;
    }
    .mini-card {
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .mini-name { font-size: 24px; color: var(--text-accent); margin: 6px 0 14px; }
    .mini-art {
      width: 140px; height: 140px; margin: 0 auto 14px;
      border-radius: 50%; border: 3px solid var(--border-col); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
    }
    .mini-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .anim-spin img { animation: spin360 14s linear infinite; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .anim-float { animation: floatY 3.5s ease-in-out infinite; }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .anim-flip img { animation: flipY 7s ease-in-out infinite; }
    @keyframes flipY { 0%,100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }

    .mini-wish { font-size: 13.5px; line-height: 1.55; margin-bottom: 10px; white-space: pre-line; }
    .mini-wish.sub { font-size: 13px; font-style: italic; color: var(--text-accent); border-top: 1px dashed var(--border-col); padding-top: 9px; }
    .mini-by { font-size: 13px; margin-top: 10px; }
    .mini-by strong { color: var(--text-accent); }
  </style>
</head>
<body data-theme="black-gold">

      </div>

      <div class="grp">
        <label>4. Scanned Drawing / Photo Filename</label>
        <input type="text" id="mArtwork" value="artwork.jpg" oninput="syncPreview()" />
      </div>

      <div class="grp">
        <label>5. Artwork Motion</label>
        <select id="mAnim" onchange="syncPreview()">
          <option value="anim-spin">360° Smooth Spin</option>
          <option value="anim-float">Gentle Floating</option>
          <option value="anim-flip">3D Coin Flip</option>
          <option value="anim-none">No Motion</option>
        </select>
      </div>

      <div class="grp">
        <label>6. Preset Wish Dropdown (EN / BM / ID / Doa)</label>
        <select id="mPreset" onchange="applyPreset()">
          <option value="0">1. All 3 Languages (EN + BM + ID + Doa)</option>
          <option value="1">2. Bahasa Melayu + Doa Islam</option>
          <option value="2">3. Bahasa Indonesia + Doa Islam</option>
          <option value="3">4. English + Doa Islam</option>
          <option value="4">5. Melayu + Indonesia (No English)</option>
          <option value="5">6. Bahasa Melayu Sahaja</option>
          <option value="6">7. Bahasa Indonesia Sahaja</option>
          <option value="7">8. English Only</option>
          <option value="8">9. Family Blessing (EN + BM + ID)</option>
          <option value="9">10. Short &amp; Sweet (EN + BM + ID)</option>
        </select>
      </div>

      <div class="grp">
        <label>7. Wish 1 (Main Wish — leave blank if not needed)</label>
        <textarea id="mWish1" rows="2" oninput="syncPreview()"></textarea>
      </div>

      <div class="grp">
        <label>8. Wish 2 (Second Language — leave blank if not needed)</label>
        <textarea id="mWish2" rows="2" oninput="syncPreview()"></textarea>
      </div>

      <div class="grp">
        <label>9. Wish 3 (Third Language — leave blank if not needed)</label>
        <textarea id="mWish3" rows="2" oninput="syncPreview()"></textarea>
      </div>

      <div class="grp">
        <label>10. Sender Name</label>
        <input type="text" id="mSender" value="Dzul" oninput="syncPreview()" />
      </div>

      <button class="btn-dl" onclick="generateCleanRecipientHTML()">Download Clean index.html for Recipient</button>
    </div>

    <div class="preview-shell" id="previewShell">
      <div class="mini-card">
        <div style="color:var(--text-accent);letter-spacing:4px;font-size:14px;">✦ ✦ ✦</div>
        <div id="pHeader" style="font-family:sans-serif;font-size:10.5px;letter-spacing:1.8px;color:var(--text-accent);margin-top:4px;">HAPPY BIRTHDAY • SELAMAT HARI LAHIR • SELAMAT ULANG TAHUN</div>
        <div class="mini-name" id="pName">Sahabatku</div>
        <div class="mini-art anim-spin" id="pArtFrame">
          <img id="pImg" src="artwork.jpg" alt="Artwork" onerror="this.style.display='none';document.getElementById('pFb').style.display='flex';" />
          <div id="pFb" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:36px;">🎂</div>
        </div>
        <div class="mini-wish" id="pWish1"></div>
        <div class="mini-wish sub" id="pWish2"></div>
        <div class="mini-wish sub" id="pWish3"></div>
        <div class="mini-by">With warm wishes,<br /><strong id="pSender">Dzul</strong></div>
      </div>
    </div>
  </div>

    function applyPreset() {
      const w = WISHES[document.getElementById('mPreset').value];
      document.getElementById('mHeaderLang').value = w.header;
      document.getElementById('mWish1').value = w.w1;
      document.getElementById('mWish2').value = w.w2;
      document.getElementById('mWish3').value = w.w3;
      syncPreview();
    }

    function getData() {
      return {
        theme: document.getElementById('mTheme').value,
        header: document.getElementById('mHeaderLang').value,
        recipient: document.getElementById('mRecipient').value,
        artwork: document.getElementById('mArtwork').value || "artwork.jpg",
        anim: document.getElementById('mAnim').value,
        w1: document.getElementById('mWish1').value,
        w2: document.getElementById('mWish2').value,
        w3: document.getElementById('mWish3').value,
        sender: document.getElementById('mSender').value
      };
    }

    function toggleWishLine(el, text) {
      if (text && text.trim() !== "") {
        el.style.display = "block";
        el.textContent = text;
      } else {
        el.style.display = "none";
      }
    }

    function syncPreview() {
      const d = getData();
      document.getElementById('previewShell').setAttribute('data-theme', d.theme);
      document.getElementById('pHeader').textContent = d.header;
      document.getElementById('pName').textContent = d.recipient || "Happy Birthday!";
      document.getElementById('pArtFrame').className = "mini-art " + d.anim;
      const img = document.getElementById('pImg');
      const fb = document.getElementById('pFb');
      img.style.display = "block";
      fb.style.display = "none";
      img.src = d.artwork;

      toggleWishLine(document.getElementById('pWish1'), d.w1);
      toggleWishLine(document.getElementById('pWish2'), d.w2);
      toggleWishLine(document.getElementById('pWish3'), d.w3);
      document.getElementById('pSender').textContent = d.sender;
    }

    function generateCleanRecipientHTML() {
      const d = getData();
      const cleanHTML = `<!DOCTYPE html>

    .env-flap { position: absolute; top: 0; left: 0; width: 100%; height: 115px; background: var(--env-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform 0.7s cubic-bezier(0.4,0,0.2,1); z-index: 4; border-top: 2px solid var(--border-col); }

    .env-pocket { position: absolute; bottom: 0; left: 0; width: 100%; height: 125px; background: var(--env-body); clip-path: polygon(0 100%, 0 15%, 50% 65%, 100% 15%, 100% 100%); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 3; }
    .wax-seal { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: var(--text-accent); color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; z-index: 5; border: 2px solid var(--card-bg); animation: pulseSeal 2s infinite; }
    @keyframes pulseSeal { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.08); } }
    .tap-hint { position: absolute; bottom: -38px; width: 100%; text-align: center; font-size: 14px; color: var(--text-accent); font-family: system-ui, sans-serif; }
    .card { display: none; width: 100%; background: var(--card-bg); border: 2px solid var(--border-col); border-radius: 18px; padding: 26px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 30px var(--shadow-col); animation: cardReveal 0.85s cubic-bezier(0.22,1,0.36,1) forwards; }
    .card.visible { display: block; }
    @keyframes cardReveal { from { opacity: 0; transform: translateY(35px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .recipient-name { font-size: 28px; font-weight: bold; color: var(--text-accent); margin: 6px 0 16px; }
    .artwork-frame { width: 180px; height: 180px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--border-col); padding: 5px; box-shadow: 0 0 22px var(--shadow-col); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); }
    .artwork-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .anim-spin img { animation: spin360 14s linear infinite; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .anim-float { animation: gentleFloat 3.5s ease-in-out infinite; }
    @keyframes gentleFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .anim-flip img { animation: coinFlip 7s ease-in-out infinite; }
    @keyframes coinFlip { 0%,100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }
    .wish-box { font-size: 15px; line-height: 1.6; margin-bottom: 12px; white-space: pre-line; }
    .wish-box.extra { font-size: 14px; font-style: italic; color: var(--text-accent); border-top: 1px dashed var(--border-col); padding-top: 11px; }
    .sender-signoff { font-size: 14px; opacity: 0.92; margin-top: 12px; }
    .sender-signoff strong { color: var(--text-accent); }
    .replay-btn { margin-top: 18px; background: transparent; border: 1px solid var(--border-col); color: var(--text-accent); padding: 7px 14px; border-radius: 20px; font-size: 12px; font-family: system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body data-theme="${d.theme}">
  <div class="sparkles" id="sparkles"></div>
  <main class="stage">
    <div class="envelope-wrapper" id="envelope" onclick="openCard()">
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-pocket"></div>
      <div class="wax-seal">Tap</div>
      <div class="tap-hint">Tap envelope to open</div>
    </div>
    <section class="card" id="card">
      <div style="color:var(--text-accent);font-size:18px;letter-spacing:6px;margin-bottom:8px;">✦ ✦ ✦</div>
      <div style="font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-accent);margin-bottom:6px;">${escapeHtml(d.header)}</div>
      <h1 class="recipient-name">${escapeHtml(d.recipient || "Happy Birthday!")}</h1>
      <div class="artwork-frame ${d.anim}">
        <img src="${escapeHtml(d.artwork)}" alt="Birthday Artwork" onerror="this.style.display='none';document.getElementById('artFallback').style.display='flex';" />
        <div id="artFallback" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:44px;">🎂</div>
      </div>
      ${d.w1.trim() ? `<p class="wish-box">${escapeHtml(d.w1)}</p>` : ""}
      ${d.w2.trim() ? `<p class="wish-box extra">${escapeHtml(d.w2)}</p>` : ""}
      ${d.w3.trim() ? `<p class="wish-box extra">${escapeHtml(d.w3)}</p>` : ""}
      <div class="sender-signoff">With warm wishes,<br /><strong>${escapeHtml(d.sender)}</strong></div>
      <button class="replay-btn" onclick="playBirthdayMelody()">♪ Replay 3D Echo Melody</button>
    </section>
  </main>
  <script>
    const c = document.getElementById('sparkles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (5 + Math.random() * 5) + 's';
      c.appendChild(s);
    }
    function openCard() {
      document.getElementById('envelope').classList.add('opening');
      playBirthdayMelody();
      setTimeout(() => {
        document.getElementById('envelope').classList.add('hidden-env');
        document.getElementById('card').classList.add('visible');
      }, 650);
    }
let audioCtx = null;
function playBirthdayMelody() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.75;

    const delayL = audioCtx.createDelay();
    delayL.delayTime.value = 0.26;
    const delayR = audioCtx.createDelay();
    delayR.delayTime.value = 0.39;

    const feedbackL = audioCtx.createGain();
    feedbackL.gain.value = 0.35;
    const feedbackR = audioCtx.createGain();
    feedbackR.gain.value = 0.35;

    const merger = audioCtx.createChannelMerger(2);

    delayL.connect(feedbackL);
    feedbackL.connect(delayR);
    delayR.connect(feedbackR);
    feedbackR.connect(delayL);

    delayL.connect(merger, 0, 0);
    delayR.connect(merger, 0, 1);

    merger.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    const notes = [
      [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [349.23, 0.55], [329.63, 1.00],
      [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [392.00, 0.55], [349.23, 1.00],
      [261.63, 0.35], [261.63, 0.20], [523.25, 0.55], [440.00, 0.55], [349.23, 0.55], [329.63, 0.55], [293.66, 0.90],
      [466.16, 0.35], [466.16, 0.20], [440.00, 0.55], [349.23, 0.55], [392.00, 0.55], [349.23, 1.20]
    ];

    let time = audioCtx.currentTime + 0.08;
    notes.forEach(([freq, dur], idx) => {
      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();
      const panner = audioCtx.createStereoPanner();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);
      panner.pan.setValueAtTime(Math.sin(idx * 0.7) * 0.65, time);

      noteGain.gain.setValueAtTime(0.001, time);
      noteGain.gain.exponentialRampToValueAtTime(0.85, time + 0.03);
      noteGain.gain.exponentialRampToValueAtTime(0.001, time + dur + 0.35);

      osc.connect(noteGain);
      noteGain.connect(panner);
      panner.connect(masterGain);
      panner.connect(delayL);

      osc.start(time);
      osc.stop(time + dur + 0.4);
      time += dur + 0.05;
    });
  } catch (e) {}
}
  <\/script>
</body>
</html>`;
      const blob = new Blob([cleanHTML], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    applyPreset();
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday E-Card</title>
  <style>
    /* ============================================================
       10 BUILT-IN COLOR THEMES (SKINS)
       ============================================================ */
    :root {
      --bg-grad: radial-gradient(circle at top, #1f1c18, #090806);
      --env-body: #171511;
      --env-flap: #26221a;
      --card-bg: #12100d;
      --text-main: #f8ecd4;
      --text-accent: #d4af37;
      --border-col: #d4af37;
      --shadow-col: rgba(212, 175, 55, 0.3);
    }

    [data-theme="black-gold"] {
      --bg-grad: radial-gradient(circle at top, #1f1c18, #090806);
      --env-body: #171511;
      --env-flap: #26221a;
      --card-bg: #12100d;
      --text-main: #f8ecd4;
      --text-accent: #d4af37;
      --border-col: #d4af37;
      --shadow-col: rgba(212, 175, 55, 0.3);
    }

    [data-theme="emerald-gold"] {
      --bg-grad: radial-gradient(circle at top, #0d3b2e, #041a14);
      --env-body: #092e24;
      --env-flap: #114738;
      --card-bg: #07261d;
      --text-main: #ffffff;
      --text-accent: #facc15;
      --border-col: #facc15;
      --shadow-col: rgba(250, 204, 21, 0.28);
    }

    [data-theme="blue-white"] {
      --bg-grad: radial-gradient(circle at top, #172a45, #0a192f);
      --env-body: #112240;
      --env-flap: #1d3557;
      --card-bg: #0d1b33;
      --text-main: #f8fafc;
      --text-accent: #64ffda;
      --border-col: #e2e8f0;
      --shadow-col: rgba(100, 255, 218, 0.22);
    }

    [data-theme="pink-gold"] {
      --bg-grad: radial-gradient(circle at top, #fce7f3, #f9a8d4);
      --env-body: #f472b6;
      --env-flap: #ec4899;
      --card-bg: #fff1f2;
      --text-main: #4a1525;
      --text-accent: #b45309;
      --border-col: #d97706;
      --shadow-col: rgba(217, 119, 6, 0.25);
    }

    [data-theme="classic-ivory"] {
      --bg-grad: radial-gradient(circle at top, #faf6ee, #e7dec8);
      --env-body: #dfd3bc;
      --env-flap: #cfc0a3;
      --card-bg: #fffdf9;
      --text-main: #292524;
      --text-accent: #b45309;
      --border-col: #b45309;
      --shadow-col: rgba(180, 83, 9, 0.2);
    }

    [data-theme="sunset-coral"] {
      --bg-grad: radial-gradient(circle at top, #fb7185, #9f1239);
      --env-body: #be123c;
      --env-flap: #e11d48;
      --card-bg: #881337;
      --text-main: #ffffff;
      --text-accent: #fde047;
      --border-col: #fde047;
      --shadow-col: rgba(253, 224, 71, 0.25);
    }

    [data-theme="royal-purple"] {
      --bg-grad: radial-gradient(circle at top, #3b0764, #170326);
      --env-body: #2e064d;
      --env-flap: #4c0b7d;
      --card-bg: #220438;
      --text-main: #f3e8ff;
      --text-accent: #f59e0b;
      --border-col: #f59e0b;
      --shadow-col: rgba(245, 158, 11, 0.28);
    }

    [data-theme="teal-mint"] {
      --bg-grad: radial-gradient(circle at top, #115e59, #042f2e);
      --env-body: #0f4c48;
      --env-flap: #166963;
      --card-bg: #0b3b38;
      --text-main: #f0fdfa;
      --text-accent: #5eead4;
      --border-col: #5eead4;
      --shadow-col: rgba(94, 234, 212, 0.25);
    }

    [data-theme="crimson-velvet"] {
      --bg-grad: radial-gradient(circle at top, #7f1d1d, #2b0606);
      --env-body: #5c1111;
      --env-flap: #7f1d1d;
      --card-bg: #420b0b;
      --text-main: #fef2f2;
      --text-accent: #fbbf24;
      --border-col: #fbbf24;
      --shadow-col: rgba(251, 191, 36, 0.28);
    }

    [data-theme="minimal-slate"] {
      --bg-grad: radial-gradient(circle at top, #334155, #0f172a);
      --env-body: #1e293b;
      --env-flap: #334155;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-accent: #38bdf8;
      --border-col: #94a3b8;
      --shadow-col: rgba(56, 189, 248, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background: var(--bg-grad);
      color: var(--text-main);
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 14px 16px 36px 16px;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* TOP QUICK DROPDOWN BAR */
    .top-menu-bar {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .top-select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-col);
      background: rgba(15, 15, 15, 0.82);
      color: var(--text-main);
      font-size: 12.5px;
      outline: none;
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--text-accent);
      border-radius: 50%;
      opacity: 0.45;
      animation: floatUp 7s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    /* ENVELOPE SHOWN FIRST */
    .envelope-wrapper {
      width: 310px;
      height: 210px;
      position: relative;
      cursor: pointer;
      perspective: 1000px;
      margin: 44px auto 54px auto;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .envelope-wrapper:active {
      transform: scale(0.97);
    }

    .envelope-wrapper.hidden-env {
      display: none;
    }

    .env-back {
      position: absolute;
      inset: 0;
      background: var(--env-body);
      border: 2px solid var(--border-col);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 25px var(--shadow-col);
    }

    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 115px;
      background: var(--env-flap);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      border-top: 2px solid var(--border-col);
    }

    .envelope-wrapper.opening .env-flap {
      transform: rotateX(180deg);
    }

    .env-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 125px;
      background: var(--env-body);
      clip-path: polygon(0 100%, 0 15%, 50% 65%, 100% 15%, 100% 100%);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 3;
    }

    .wax-seal {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--text-accent);
      color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      border: 2px solid var(--card-bg);
      animation: pulseSeal 2s infinite;
    }

    @keyframes pulseSeal {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
    }

    .tap-hint {
      position: absolute;
      bottom: -40px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: var(--text-accent);
      letter-spacing: 1px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* CARD HIDDEN UNTIL ENVELOPE IS TAPPED */
    .card {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-col);
      border-radius: 18px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px var(--shadow-col);
      animation: cardReveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      position: relative;
    }

    .card.visible {
      display: block;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(35px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-ornament {
      color: var(--text-accent);
      font-size: 18px;
      letter-spacing: 6px;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-accent);
      margin-bottom: 6px;
    }

    .recipient-name {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-accent);
      margin-bottom: 16px;
      line-height: 1.2;
      word-wrap: break-word;
    }

    .artwork-frame {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      border: 3px solid var(--border-col);
      padding: 5px;
      box-shadow: 0 0 22px var(--shadow-col);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      perspective: 800px;
    }

    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .anim-spin img {
      animation: spin360 14s linear infinite;
    }
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-float {
      animation: gentleFloat 3.5s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }

    .anim-flip img {
      animation: coinFlip 7s ease-in-out infinite;
    }
    @keyframes coinFlip {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    .wish-primary {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-main);
      margin-bottom: 14px;
      white-space: pre-line;
    }

    .wish-secondary {
      font-size: 14.5px;
      line-height: 1.6;
      font-style: italic;
      color: var(--text-accent);
      border-top: 1px dashed var(--border-col);
      padding-top: 12px;
      margin-top: 10px;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .sender-signoff {
      font-size: 14px;
      color: var(--text-main);
      opacity: 0.9;
      margin-top: 10px;
    }

    .sender-signoff strong {
      color: var(--text-accent);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid var(--border-col);
      color: var(--text-accent);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
    }

    /* MAKER PANEL */
    .maker-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.97);
      color: #f1f5f9;
      z-index: 100;
      overflow-y: auto;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .maker-panel.open { display: block; }

    .maker-box {
      max-width: 480px;
      margin: 0 auto;
    }

    .maker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .maker-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .maker-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .maker-group input,
    .maker-group select,
    .maker-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
    }

    .maker-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-primary {
      background: #eab308;
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-secondary {
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body data-theme="black-gold">

  <div class="sparkles" id="sparkles"></div>

  <!-- INSTANT VISIBLE DROPDOWN MENU BAR -->
  <div class="top-menu-bar">
    <select id="quickThemeSelect" class="top-select" onchange="quickChangeTheme(this.value)" title="Select Style / Skin">
      <option value="black-gold">Style: 1. Black & Gold</option>
      <option value="emerald-gold">Style: 2. Emerald & Gold</option>
      <option value="blue-white">Style: 3. Dark Blue & White</option>
      <option value="pink-gold">Style: 4. Pink & Gold</option>
      <option value="classic-ivory">Style: 5. Classic Ivory</option>
      <option value="sunset-coral">Style: 6. Sunset Coral</option>
      <option value="royal-purple">Style: 7. Royal Purple</option>
      <option value="teal-mint">Style: 8. Teal & Mint</option>
      <option value="crimson-velvet">Style: 9. Crimson Velvet</option>
      <option value="minimal-slate">Style: 10. Minimal Slate</option>
    </select>

    <select id="quickWishSelect" class="top-select" onchange="quickChangeWish(this.value)" title="Select Birthday Wish">
      <option value="0">Wish: 1. Islamic + EN</option>
      <option value="1">Wish: 2. Islamic + BM</option>
      <option value="2">Wish: 3. EN + BM Warm</option>
      <option value="3">Wish: 4. Barakallah Doa</option>
      <option value="4">Wish: 5. English Classic</option>
      <option value="5">Wish: 6. Melayu Istimewa</option>
      <option value="6">Wish: 7. Short & Sweet</option>
      <option value="7">Wish: 8. Friendship</option>
      <option value="8">Wish: 9. Family Blessing</option>
      <option value="9">Wish: 10. New Chapter</option>
    </select>
  </div>

  <main class="stage">
    <!-- STEP 1: ENVELOPE SHOWN FIRST -->
    <div class="envelope-wrapper" id="envelope" onclick="openCard()">
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-pocket"></div>
      <div class="wax-seal">Tap</div>
      <div class="tap-hint">Tap envelope to open</div>
    </div>

    <!-- STEP 2: REVEALED CARD -->
    <section class="card" id="card">
      <div class="card-ornament">✦ ✦ ✦</div>
      <div class="card-subtitle">Selamat Hari Lahir • Happy Birthday</div>
      <h1 class="recipient-name" id="displayRecipient">Sahabatku</h1>

      <div class="artwork-frame anim-spin" id="artworkFrame">
        <img id="displayArtwork" src="artwork.jpg" alt="Birthday Artwork" onerror="this.style.display='none'; document.getElementById('artFallback').style.display='flex';" />
        <div id="artFallback" style="display:none; width:100%; height:100%; align-items:center; justify-content:center; font-size:44px;">🎂</div>
      </div>

      <p class="wish-primary" id="displayPrimaryWish"></p>
      <p class="wish-secondary" id="displaySecondaryWish"></p>

      <div class="sender-signoff">
        With warm wishes,<br />
        <strong id="displaySender">Dzul</strong>
      </div>

      <div class="btn-row">
        <button class="pill-btn" onclick="playBirthdayMelody()">♪ Replay 3D Echo Melody</button>
        <button class="pill-btn" onclick="toggleMaker(true)">✎ Edit / Maker</button>
      </div>
    </section>
  </main>

  <!-- MAKER PANEL -->
  <div class="maker-panel" id="makerPanel">
    <div class="maker-box">
      <div class="maker-header">
        <h3>Card Customizer</h3>
        <button class="btn-secondary" style="padding:6px 12px;" onclick="toggleMaker(false)">Close ✕</button>
      </div>

      <div class="maker-group">
        <label>1. Color Theme (10 Styles)</label>
        <select id="inTheme" onchange="applyLiveForm()">
          <option value="black-gold">1. Royal Dark (Black & Gold)</option>
          <option value="emerald-gold">2. Emerald Islamic (Green & Gold)</option>
          <option value="blue-white">3. Midnight Sky (Dark Blue & White)</option>
          <option value="pink-gold">4. Blush Rose (Pink & Gold)</option>
          <option value="classic-ivory">5. Classic Ivory (Cream & Gold)</option>
          <option value="sunset-coral">6. Sunset Coral (Rose & Yellow)</option>
          <option value="royal-purple">7. Royal Purple (Plum & Gold)</option>
          <option value="teal-mint">8. Modern Teal & Mint</option>
          <option value="crimson-velvet">9. Crimson Velvet (Maroon & Gold)</option>
          <option value="minimal-slate">10. Minimalist Slate (Dark Grey & Sky)</option>
        </select>
      </div>

      <div class="maker-group">
        <label>2. Recipient's Name</label>
        <input type="text" id="inRecipient" placeholder="e.g. Ahmad / Sarah" oninput="applyLiveForm()" />
      </div>

      <div class="maker-group">
        <label>3. Artwork / Photo Filename (in same GitHub folder)</label>
        <input type="text" id="inArtwork" value="artwork.jpg" oninput="applyLiveForm()" />
      </div>

      <div class="maker-group">
        <label>4. Artwork Animation Effect</label>
        <select id="inAnim" onchange="applyLiveForm()">
          <option value="anim-spin">360° Smooth Spin</option>
          <option value="anim-float">Gentle Floating</option>
          <option value="anim-flip">3D Coin Rotate</option>
          <option value="anim-none">Static Frame (No Spin)</option>
        </select>
      </div>

      <div class="maker-group">
        <label>5. Preset Wishes (Islamic / English / Malay)</label>
        <select id="inPreset" onchange="selectPresetWish()">
          <option value="0">1. Islamic Doa + English Blessing (Bilingual)</option>
          <option value="1">2. Islamic Doa + Ucapan Melayu (Bilingual)</option>
          <option value="2">3. Warm Bilingual (English + Bahasa Melayu)</option>
          <option value="3">4. Islamic Barakallah Fi Umrik (Full Doa)</option>
          <option value="4">5. Classic Warm English Birthday Wish</option>
          <option value="5">6. Ucapan Hari Lahir Istimewa (Melayu)</option>
          <option value="6">7. Short & Sweet (English + Malay)</option>
          <option value="7">8. Gratitude & Friendship Blessing</option>
          <option value="8">9. Family & Loved Ones Blessing (Bilingual)</option>
          <option value="9">10. Inspiring New Chapter Wish</option>
        </select>
      </div>

      <div class="maker-group">
        <label>6. Primary Message (Editable)</label>
        <textarea id="inPrimary" rows="3" oninput="applyLiveForm()"></textarea>
      </div>

      <div class="maker-group">
        <label>7. Secondary / Bilingual Message (Optional)</label>
        <textarea id="inSecondary" rows="3" oninput="applyLiveForm()"></textarea>
      </div>

      <div class="maker-group">
        <label>8. Sender's Name</label>
        <input type="text" id="inSender" placeholder="e.g. Dzul" oninput="applyLiveForm()" />
      </div>

      <div class="maker-actions">
        <button class="btn-secondary" onclick="previewCardFromMaker()">Preview Card</button>
        <button class="btn-primary" onclick="downloadCustomHTML()">Download index.html</button>
      </div>
    </div>
  </div>

  </script>

      },
      {
        primary: "Wishing you a very Happy Birthday! May this new chapter bring you fresh opportunities, great health, and genuine happiness.",
        secondary: ""
      },
      {
        primary: "Selamat Hari Lahir! Moga hari istimewa ini membawa seribu satu kegembiraan, ketenangan hati, dan kejayaan dalam setiap impian.",
        secondary: ""
      },
      {
        primary: "Happy Birthday! Stay blessed, stay healthy, and keep shining.",
        secondary: "Selamat Hari Jadi! Semoga sentiasa sihat dan ceria selalu."
      },
      {
        primary: "Thank you for being such a wonderful presence. Wishing you a year overflowing with kindness and success.",
        secondary: "Terima kasih atas persahabatan yang bermakna. Selamat menyambut hari kelahiran yang penuh ceria!"
      },
      {

      {

        secondary: "Tahun baru, semangat baru. Semoga segala urusan dipermudahkan dan impian tercapai."

    ];

    let CONFIG = JSON.parse(document.getElementById('card-config').textContent);

    function renderCard() {
      document.body.setAttribute('data-theme', CONFIG.theme);
      document.getElementById('quickThemeSelect').value = CONFIG.theme;
      document.getElementById('displayRecipient').textContent = CONFIG.recipient || "Happy Birthday!";
      document.getElementById('displayPrimaryWish').textContent = CONFIG.primary || "";

      const secEl = document.getElementById('displaySecondaryWish');
      if (CONFIG.secondary && CONFIG.secondary.trim() !== "") {
        secEl.style.display = "block";
        secEl.textContent = CONFIG.secondary;
      } else {
        secEl.style.display = "none";
      }

      document.getElementById('displaySender').textContent = CONFIG.sender || "";

      const frame = document.getElementById('artworkFrame');
      frame.className = "artwork-frame " + (CONFIG.anim || "anim-spin");

      const img = document.getElementById('displayArtwork');
      const fallback = document.getElementById('artFallback');
      img.style.display = "block";
      fallback.style.display = "none";
      img.src = (CONFIG.artwork || "artwork.jpg") + "?v=" + Date.now();
    }

    function quickChangeTheme(themeVal) {
      CONFIG.theme = themeVal;
      renderCard();
    }

    function quickChangeWish(idx) {
      const preset = PRESET_WISHES[idx];
      if (!preset) return;
      CONFIG.primary = preset.primary;
      CONFIG.secondary = preset.secondary;
      renderCard();
    }

    function createSparkles() {
      const container = document.getElementById('sparkles');
      container.innerHTML = '';
      for (let i = 0; i < 18; i++) {
        const dot = document.createElement('div');
        dot.className = 'sparkle';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.animationDelay = (Math.random() * 6) + 's';
        dot.style.animationDuration = (5 + Math.random() * 5) + 's';
        container.appendChild(dot);
      }
    }

    function openCard() {
      const env = document.getElementById('envelope');
      const card = document.getElementById('card');
      env.classList.add('opening');
      playBirthdayMelody();

      setTimeout(() => {
        env.classList.add('hidden-env');
        card.classList.add('visible');
      }, 650);
    }

    let audioCtx = null;

    function playBirthdayMelody() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.28;

        const delayL = audioCtx.createDelay();
        delayL.delayTime.value = 0.26;
        const delayR = audioCtx.createDelay();
        delayR.delayTime.value = 0.39;

        const feedbackL = audioCtx.createGain();
        feedbackL.gain.value = 0.35;
        const feedbackR = audioCtx.createGain();
        feedbackR.gain.value = 0.35;

        const merger = audioCtx.createChannelMerger(2);

        delayL.connect(feedbackL);
        feedbackL.connect(delayR);
        delayR.connect(feedbackR);
        feedbackR.connect(delayL);

        delayL.connect(merger, 0, 0);
        delayR.connect(merger, 0, 1);

        merger.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const notes = [
          [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [349.23, 0.55], [329.63, 1.00],
          [261.63, 0.35], [261.63, 0.20], [293.66, 0.55], [261.63, 0.55], [392.00, 0.55], [349.23, 1.00],
          [261.63, 0.35], [261.63, 0.20], [523.25, 0.55], [440.00, 0.55], [349.23, 0.55], [329.63, 0.55], [293.66, 0.90],
          [466.16, 0.35], [466.16, 0.20], [440.00, 0.55], [349.23, 0.55], [392.00, 0.55], [349.23, 1.20]
        ];

        let time = audioCtx.currentTime + 0.08;

        notes.forEach(([freq, dur], index) => {
          const osc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          const panner = audioCtx.createStereoPanner();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);
          panner.pan.setValueAtTime(Math.sin(index * 0.7) * 0.65, time);

          noteGain.gain.setValueAtTime(0.001, time);
          noteGain.gain.exponentialRampToValueAtTime(0.65, time + 0.03);
          noteGain.gain.exponentialRampToValueAtTime(0.001, time + dur + 0.35);

          osc.connect(noteGain);
          noteGain.connect(panner);
          panner.connect(masterGain);
          panner.connect(delayL);

          osc.start(time);
          osc.stop(time + dur + 0.4);

          time += dur + 0.05;
        });
      } catch (e) {
        console.log("Audio requires user tap:", e);
      }
    }

    function toggleMaker(show) {
      const panel = document.getElementById('makerPanel');
      if (show) {
        document.getElementById('inTheme').value = CONFIG.theme;
        document.getElementById('inRecipient').value = CONFIG.recipient;
        document.getElementById('inArtwork').value = CONFIG.artwork;
        document.getElementById('inAnim').value = CONFIG.anim;
        document.getElementById('inPrimary').value = CONFIG.primary;
        document.getElementById('inSecondary').value = CONFIG.secondary;
        document.getElementById('inSender').value = CONFIG.sender;
        panel.classList.add('open');
      } else {
        panel.classList.remove('open');
      }
    }

    function selectPresetWish() {
      const idx = document.getElementById('inPreset').value;
      const preset = PRESET_WISHES[idx];
      document.getElementById('inPrimary').value = preset.primary;
      document.getElementById('inSecondary').value = preset.secondary;
      applyLiveForm();
    }

    function applyLiveForm() {
      CONFIG = {
        theme: document.getElementById('inTheme').value,
        recipient: document.getElementById('inRecipient').value,
        artwork: document.getElementById('inArtwork').value,
        anim: document.getElementById('inAnim').value,
        primary: document.getElementById('inPrimary').value,
        secondary: document.getElementById('inSecondary').value,
        sender: document.getElementById('inSender').value
      };
      renderCard();
    }

    function previewCardFromMaker() {
      applyLiveForm();
      toggleMaker(false);
      document.getElementById('envelope').classList.add('hidden-env');
      document.getElementById('card').classList.add('visible');
    }

    function downloadCustomHTML() {
      applyLiveForm();
      const docClone = document.documentElement.cloneNode(true);
      docClone.querySelector('#makerPanel').classList.remove('open');
      docClone.querySelector('#envelope').classList.remove('opening', 'hidden-env');
      docClone.querySelector('#card').classList.remove('visible');
      docClone.querySelector('#sparkles').innerHTML = '';
      docClone.querySelector('#card-config').textContent = JSON.stringify(CONFIG, null, 2);

      const finalHTML = "<!DOCTYPE html>\n" + docClone.outerHTML;
      const blob = new Blob([finalHTML], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    createSparkles();
    renderCard();

    if (window.location.search.includes('edit=1')) {
      toggleMaker(true);
    }
  </script>
